name: Publicar servicio de IA

# Solo se ejecuta a mano (Actions > Publicar servicio de IA > Run workflow).
# Requiere estos secretos en GitHub (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY, OWNER_ACCESS_CODE
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ..
      - run: npm ci
      - run: npx wrangler deploy
      - name: Guardar secretos en el servicio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OWNER_ACCESS_CODE: ${{ secrets.OWNER_ACCESS_CODE }}
        run: |
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          printf '%s' "$OWNER_ACCESS_CODE" | npx wrangler secret put OWNER_ACCESS_CODE
